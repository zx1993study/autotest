[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest-web-automation"
version = "1.0.0"
description = "Shared Playwright and Stagehand runtime for the autotest platform"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

