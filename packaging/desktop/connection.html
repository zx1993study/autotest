<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autotest Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px 'Microsoft YaHei',sans-serif;color:#1e2933;background:#f5f7fa;letter-spacing:0}main{max-width:480px;margin:12vh auto;padding:32px}h1{font-size:24px;margin:0 0 24px}label{display:block;margin:18px 0 8px}input{width:100%;height:40px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:4px;background:white}button{margin:18px 8px 0 0;padding:10px 18px;border:1px solid #b9c6d1;border-radius:4px;background:white;cursor:pointer}button.primary{background:#087e8b;color:white;border-color:#087e8b}p{line-height:1.6;overflow-wrap:anywhere}#status{color:#506170;min-height:44px}.error{color:#b42318!important}footer{margin-top:28px;border-top:1px solid #dce3ea;padding-top:16px;font-size:12px}@media(max-width:500px){main{margin:6vh auto;padding:24px}}
</style>
<main><h1>Autotest Platform</h1><p id="status" role="status">正在连接平台…</p>
<div id="connection-settings" hidden>
<label for="url">平台地址</label><input id="url" type="url" autocomplete="url" placeholder="HTTPS 平台地址或登录页链接">
<button class="primary" id="connect">连接</button><button id="logs">打开日志</button>
</div><footer id="agent">本地 Agent：检查中</footer></main>
<script>
window.addEventListener('pywebviewready',async()=>{
 const state=await window.pywebview.api.status();document.querySelector('#url').value=state.server_url||'';
 document.querySelector('#agent').textContent='本地 Agent：'+state.agent;
});
document.querySelector('#connect').onclick=async()=>{
 const status=document.querySelector('#status');status.className='';status.textContent='正在连接平台…';
 const result=await window.pywebview.api.connect(document.querySelector('#url').value);
 if(result.error){status.textContent=result.error;status.className='error';}
};
document.querySelector('#logs').onclick=()=>window.pywebview.api.open_logs();
function showConnectionError(message){const status=document.querySelector('#status');status.textContent=message;status.className='error';document.querySelector('#connection-settings').hidden=false;}
</script>
</html>
